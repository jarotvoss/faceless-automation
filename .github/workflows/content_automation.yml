name: Faceless Video Automation

on:
  workflow_dispatch: # Allows manual trigger from iPad GitHub app / web
  schedule:
    - cron: '0 8 * * *' # Runs daily at 08:00 UTC (optional automation schedule)

jobs:
  build-video:
  runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts moviepy

      - name: Run Video Generator Script
        run: python generate_video.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-faceless-short
          path: output_short.mp4
